name: 버그 신고
description: 앱이 기대와 다르게 동작할 때
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        로그와 스크린샷에 실제 위치, 계정, 토큰이 보이지 않는지 먼저 확인해 주세요. 보안 문제는 SECURITY.md의 방법을 따라 주세요.
  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 있었나요?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      placeholder: |
        1. 넓은 창에서 추천곡 첫 곡을 튼다
        2. Virtual Console에서 기어를 D로 바꾼다
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: 실행한 곳
      options:
        - Pleos Connect Emulator
        - 실차
        - 기타
    validations:
      required: true
  - type: dropdown
    id: window
    attributes:
      label: 창 크기
      options:
        - 넓은 창(두 칸)
        - 좁은 창(한 칸)
        - 둘 다
  - type: dropdown
    id: drive
    attributes:
      label: 주행 상태
      options:
        - 정차(P)
        - 주행 중
        - 상관없음
  - type: input
    id: version
    attributes:
      label: 앱 버전이나 커밋
      placeholder: 0.1.0 또는 커밋 해시
  - type: textarea
    id: logs
    attributes:
      label: 로그
      description: "`adb logcat`에서 관련 부분만 붙여 주세요."
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: 확인
      options:
        - label: 로그와 스크린샷에 실제 위치, 계정, 토큰이 없습니다.
          required: true
