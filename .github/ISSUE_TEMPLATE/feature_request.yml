name: 기능 제안
description: 새 기능이나 바꾸고 싶은 동작
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 어떤 상황에서 필요한가요?
      description: 운전자가 겪는 상황으로 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안
    validations:
      required: true
  - type: textarea
    id: driving
    attributes:
      label: 주행 중에는 어떻게 보이고 동작해야 하나요?
      description: 주행 중에는 긴 글, 목록 탐색, 입력을 요구할 수 없습니다. 음성이나 스티어링 휠로 할 수 있는지도 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 생각해 본 다른 방법
