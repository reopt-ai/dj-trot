version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      androidx:
        patterns: ["androidx.*"]
      kotlin-and-agp:
        patterns: ["org.jetbrains.kotlin*", "org.jetbrains.kotlinx*", "com.android.*"]
      pleos:
        patterns: ["ai.pleos.*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
